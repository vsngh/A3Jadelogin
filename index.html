<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A3 Jade - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <div class="logo">
        <img src="logo.png" alt="A3Jade Logo">
      </div>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Discord</a></li>
        <li><a href="#">Download</a></li>
        <li><a href="#">Guide</a></li>
        <li><a href="#">Register</a></li>
        <li><a href="#">Login</a></li>
      </ul>
    </nav>

    <div class="login-section">
      <div class="login-box">
        <h2>LOGIN</h2>
        <input type="text" placeholder="Username" id="username">
        <input type="password" placeholder="Password" id="password">
        <div class="login-actions">
          <button onclick="login()">Login</button>
          <a href="#">Forgot Pasword</a>
        </div>
        <div class="about">
          <h4>About Us</h4>
          <p>
            A3Jade is brought to you by group of veteran MMO players. We know what a player truly wants and hence we have tailored the game as per your needs!
          </p>
          <small>© A3Jade 2025 All right reserved.</small>
        </div>
      </div>
      <div class="image-box">
        <img src="character.png" alt="Character">
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
